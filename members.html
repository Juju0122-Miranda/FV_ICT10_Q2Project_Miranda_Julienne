<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Homepage</title>

    <style> 
        body {
            background-image: url(https://i.pinimg.com/736x/ee/da/11/eeda119d767ca3d2d818697fe28b2062.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        /* Nav Bar until line 46  */
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: rgb(7, 20, 123);
            text-align: center;
            padding: 12px 14px;
            text-decoration: none;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        ul li a:hover {
            background-color: rgb(240, 239, 239);
        }

        /* Moves Meet the Creator to the right */
        ul li:last-child {
            float: right;
        }

        .main {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 5px 20px 20px;
            box-sizing: border-box;
        }

        #top {
            font-weight: bolder;
            font-size: 20px;
            color: rgb(7, 20, 123);
            text-align: center;
        }

        #verifbox {
            background-color: rgba(240, 239, 239, 0.9);
            width: 400px;
            max-width: 90%;
            min-height: 328px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            border-radius: 30px;
            box-sizing: border-box;
        }

        h4 {
            font-weight: bolder;
            font-size: 25px;
            color: rgb(7, 20, 123);
            margin-bottom: 10px;
        }

        h2 {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            color: rgb(7, 20, 123);
            background-color: white;
            border-radius: 20px;
            display: block;
            width: fit-content;
            margin: 15px auto 0 auto;
            padding: 10px 25px;
        }

        input[type="button"] {
            background-color: white;
            color: rgb(7, 20, 123);
            border: 2px solid rgb(7, 20, 123);
            border-radius: 10px;
            padding: 8px 20px;
            margin: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="text"] {
            background-color: white;
            color: rgb(7, 20, 123);
            border: 2px solid rgb(7, 20, 123);
            border-radius: 10px;
            padding: 10px;
            margin: 5px;
            width: 80%;
            font-weight: bold;
            box-sizing: border-box;
        }

        #result {
            background-color: rgba(240, 239, 239, 0.85);
            color: rgb(7, 20, 123);
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            width: 380px;
            max-width: 90%;
            padding: 10px 20px;
            border-radius: 20px;
            box-sizing: border-box;
        }
        
        footer {
            background-color: white;
            color:  rgba(7, 20, 123, 0.9);
            text-align: center;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }

        footer p {
            margin: 5px;
        }
    </style>
</head>

<body>

    <!-- Nav Bar -->
    <ul>
        <li><a href="members.html"><u><b>Club Members List</b></u></a></li>
        <li><a href="index.html"><b>Member Verification List</b></a></li>
        <li><a href="locator.html"><b>Non-Metal Elements Locator</b></a></li>
        <li><a href="creator.html"><b>Meet the Creator</b></a></li>
    </ul>

    <div class="main">

        <div id="top">
            <h2>Addition of New Club Members</h2>
        </div>

        <div id="verifbox">
            <h4>OBFV GIRLS' VOLLEYBALL CLUB MEMBERS</h4>
            <p>Please fill out the required information to know the results!</p>

            <input type="text" id="Fname" placeholder="Enter first name"><br>
            <input type="text" id="Sname" placeholder="Enter last name"><br>
            <input type="button" py-click="add_member" value="Enter">
            <input type="button" py-click="clear_members" value="Clear">  
        </div>

        <div id="result">
            <p id="message"></p>
        </div>

    </div>
    <script type="py" src="main.py"></script>
    <footer>
        <p>© Julienne Miranda | Project | 2nd Quarter</p>
    </footer>

</body>
</html>
